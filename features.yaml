# Feature status manifest — see CLAUDE.md "The Bookkeeping Is Part of the Change".
# status: planned | in-dev | in-test | complete | deferred.  `complete` means it WORKS.
# Ids are stable: never renumber; a new feature takes the next free id.
#
# Created 2026-10-16 from the code as it stands. No command was run against the live Meraki API
# when this file was written, so anything that needs the API is at most `in-test` (unit tests
# against local httptest servers pass) until Kent confirms it on a real organization.
version: 1
updated: 2026-10-16
features:
  - id: FEAT-0001
    title: Command line and environment configuration (flags, MERAKI_* variables, validation)
    status: complete
    components: [internal/config/config.go]
    created: 2025-07-16
    updated: 2026-10-16
    notes: >-
      Unit-tested and exercised by hand on 2026-10-16 (--help, missing command, misplaced
      option). Options must precede the command; that is the Go flag package's rule, not a bug.

  - id: FEAT-0002
    title: access command - list organizations and networks reachable with the key
    status: in-test
    components: [main.go showAccessInformation, internal/meraki]
    created: 2025-07-16
    updated: 2026-10-16
    notes: >-
      Not run against the live API in the 2026-10-16 pass. The usage examples it prints name a
      binary (meraki-routes-backup) and an --access flag that do not exist.

  - id: FEAT-0003
    title: route-tables command - static, VPN, VLAN, switch L3 and switch-stack routes
    status: in-test
    components: [main.go, internal/meraki/client.go getNetworkRoutes]
    created: 2025-07-16
    updated: 2026-10-16
    notes: >-
      Unit tests pass against httptest servers. Not verified live in this pass. Route sources
      are best-effort: a failing source contributes no routes and no error.

  - id: FEAT-0004
    title: licenses command - organization license list
    status: in-test
    components: [main.go, internal/meraki/client.go GetLicenses]
    created: 2025-07-16
    updated: 2026-10-16
    notes: >-
      No unit test of GetLicenses itself. The endpoint used is the per-device licensing one;
      behaviour on co-term or subscription organizations is unverified. Consolidated output
      ignores -org.

  - id: FEAT-0005
    title: down command - devices whose status is offline/alerting/dormant/down/unreachable/disconnected
    status: in-test
    components: [main.go, internal/meraki/client.go GetDownDevices]
    created: 2025-07-16
    updated: 2026-10-16
    notes: >-
      Uses the status field of GET /networks/{id}/devices, unlike alerting which joins the
      organization device-statuses endpoint; whether that field is populated live is unverified.
      "alerting" counts as down. Consolidated output ignores -org.

  - id: FEAT-0006
    title: alerting command - devices whose live status is alerting
    status: in-test
    components: [main.go, internal/meraki/client.go GetAlertingDevices]
    created: 2025-07-16
    updated: 2026-10-16
    notes: >-
      Not verified live. Consolidated output ignores -org. Fetches the organization status list
      once per network in -all mode.

  - id: FEAT-0007
    title: Output formats - text, JSON, XML, CSV
    status: in-dev
    components: [internal/output/writer.go]
    created: 2025-07-16
    updated: 2026-10-16
    notes: >-
      Per-network routes, licenses and devices work in all four formats (unit-tested). The
      consolidated license and device types are written as JSON when xml or csv is asked for.

  - id: FEAT-0008
    title: -all - every network in an organization or in every organization
    status: in-dev
    components: [main.go infoAll*]
    created: 2025-07-16
    updated: 2026-10-16
    notes: >-
      Consolidated stdout output works for routes (unit-level only). With -output FILE every
      network overwrites the same file, so only the last network's results survive; the
      timestamped per-network file names were removed in commit f376ff6.

  - id: FEAT-0009
    title: Retry with exponential backoff on 429 and 5xx
    status: complete
    components: [internal/meraki/client.go makeRequest]
    created: 2025-07-17
    updated: 2026-10-16
    notes: >-
      Unit-tested against httptest servers (retry on 429/500, no retry on 404, exhaustion).
      Retry-After is not read.

  - id: FEAT-0010
    title: Cross-platform build scripts (Makefile, make.ps1, build*.ps1, build-windows.bat)
    status: complete
    components: [Makefile, make.ps1, make.bat, build.ps1, build-windows.ps1, build-windows.bat]
    created: 2025-07-16
    updated: 2026-10-16
    notes: >-
      make build / make test verified on macOS arm64 on 2026-10-16; the Windows scripts were
      only parsed and their -Help run under pwsh on macOS. The `access` target of Makefile and
      make.ps1 passes the command before --apikey, which the CLI rejects.

  - id: FEAT-0011
    title: OAuth2 authentication
    status: in-dev
    components: [internal/meraki/client.go NewClientWithOAuth2]
    created: 2025-07-16
    updated: 2026-10-16
    notes: >-
      A constructor exists but nothing calls it and the CLI has no OAuth2 options.
